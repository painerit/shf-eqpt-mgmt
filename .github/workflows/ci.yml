name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sw_verification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sw_verification_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      SECRET_KEY_BASE: ci-test-secret-key-base
      RAILS_LOG_TO_STDOUT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.11"
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Check autoloading
        run: bin/rails zeitwerk:check

      - name: Run tests
        run: bin/rails test